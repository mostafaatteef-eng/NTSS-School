name: Deploy EBDA Schools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Validate portable PostgreSQL API
        run: npm run api:check

      - name: Build application
        env:
          VITE_POSTGRES_API_URL: ${{ vars.POSTGRES_API_URL || 'https://ntss-school.vercel.app' }}
          VITE_BASE_PATH: /NTSS-School/
        run: npm run build
      - name: Verify production API health and CORS
        shell: bash
        run: |
          set -euo pipefail
          API_URL="${{ vars.POSTGRES_API_URL || 'https://ntss-school.vercel.app' }}"
          curl --fail --silent --show-error "${API_URL}/api/health" >/dev/null
          HEADERS="$(mktemp)"
          curl --fail --silent --show-error -D "$HEADERS" -o /dev/null -X OPTIONS "${API_URL}/api/system-overview" \
            -H 'Origin: https://mostafaatteef-eng.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization'
          grep -qi '^access-control-allow-origin: https://mostafaatteef-eng.github.io' "$HEADERS"
          grep -qi '^access-control-allow-headers:.*authorization' "$HEADERS"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
