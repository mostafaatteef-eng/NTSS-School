name: Deploy EBDA Schools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build application
        env:
          VITE_POSTGRES_API_URL: https://ntss-school.vercel.app
          VITE_BASE_PATH: /NTSS-School/
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Production deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK" || { echo "VERCEL_DEPLOY_HOOK secret is missing"; exit 1; }
          RESPONSE="$(curl --fail-with-body --retry 3 --retry-all-errors --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK")"
          echo "$RESPONSE"
          JOB_URL="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(d.job?.url || "")' "$RESPONSE")"
          DEPLOYMENT_URL="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(d.job?.deploymentUrl || d.deploymentUrl || "")' "$RESPONSE")"
          if [ -n "$DEPLOYMENT_URL" ]; then echo "Triggered Vercel deployment: $DEPLOYMENT_URL"; fi
          test -n "$JOB_URL" || { echo "Vercel deploy hook did not return a job URL"; exit 1; }
          for attempt in $(seq 1 30); do
            STATUS_JSON="$(curl --fail-with-body --silent --show-error "$JOB_URL")"
            STATE="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(d.job?.state || d.state || "")' "$STATUS_JSON")"
            echo "Vercel deployment state: $STATE"
            case "$STATE" in
              READY|SUCCEEDED|SUCCESS)
                echo "Vercel deployment completed. Verifying canonical production alias..."
                sleep 5
                CANONICAL_STATUS="$(curl --silent --show-error -o /dev/null -w '%{http_code}' https://ntss-school.vercel.app/api/validate-session -X OPTIONS)"
                test "$CANONICAL_STATUS" = "204" || { echo "Canonical production alias is not serving the API correctly (HTTP $CANONICAL_STATUS)"; exit 1; }
                exit 0
                ;;
              ERROR|FAILED|CANCELED|CANCELLED) echo "$STATUS_JSON"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment to become ready"
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
