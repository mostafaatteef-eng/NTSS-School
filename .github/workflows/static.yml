name: Deploy EBDA Schools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build application
        env:
          VITE_POSTGRES_API_URL: https://br-tiny-surf-b5mnc6n0-api.compute.c-7.us-east-2.aws.neon.tech
        run: npm run build
      - name: Build Neon Function bundle
        run: |
          mkdir -p neon-function-dist
          npx esbuild functions/api.ts --bundle --platform=node --target=node24 --format=esm --external:pg-native --outfile=neon-function-dist/index.js
          printf '{"type":"module"}' > neon-function-dist/package.json
          cd neon-function-dist
          zip -q ../neon-function.zip index.js package.json
      - name: Upload Neon Function bundle
        uses: actions/upload-artifact@v4
        with:
          name: neon-function-bundle
          path: neon-function.zip
          retention-days: 1
      - name: Publish Neon bundle payload
        run: |
          base64 -w0 neon-function.zip > neon-function.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f neon-function.b64
          git commit -m "chore(neon): publish deployment bundle [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
