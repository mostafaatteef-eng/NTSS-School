name: Deploy EBDA Schools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Type Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build application
        env:
          VITE_POSTGRES_API_URL: https://ntss-school.vercel.app
          VITE_BASE_PATH: /NTSS-School/
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Production deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK" || { echo "VERCEL_DEPLOY_HOOK secret is missing"; exit 1; }
          curl --fail-with-body --retry 3 --retry-all-errors --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
